<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FoxCore</title><style>
:root{color-scheme:dark;--bg:#0b1017;--sidebar:#111923;--surface:#151f2b;--surface2:#1b2937;--line:#2c3b4b;--text:#edf3f9;--muted:#a3b2c1;--accent:#f59a43;--accent-hover:#ffb46e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}aside{background:var(--sidebar);padding:28px 18px;width:244px;position:fixed;inset:0 auto 0 0;overflow:auto;border-right:1px solid var(--line)}aside h1{color:var(--accent);font-size:23px;margin:0 0 2px}aside small{font-size:11px}nav{display:grid;gap:4px;margin:24px 0}nav a{display:block;padding:11px 12px;color:var(--muted);text-decoration:none;border-radius:9px;font-weight:550}nav a:hover,nav a.active{background:#283746;color:#fff}nav a.active{box-shadow:inset 3px 0 var(--accent)}main{margin-left:244px;padding:34px clamp(18px,3vw,48px);max-width:1650px}h2{font-size:25px;margin:0 0 2px}h3{font-size:16px;margin:0 0 16px}p{margin:8px 0 14px}small,.muted{color:var(--muted)}#status{color:var(--muted);font-size:12px;margin:0 0 24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:14px}.tile,section,.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}.tile small{font-size:12px}.metric{font-size:30px;font-weight:700;color:var(--accent);margin-top:10px}section{margin-top:20px}button{background:var(--accent);color:#201408;border:1px solid transparent;border-radius:9px;padding:10px 15px;font-weight:700;cursor:pointer;min-height:40px}button:hover:not(:disabled){background:var(--accent-hover)}button:disabled{opacity:.55;cursor:not-allowed}.secondary{background:#253445;color:var(--text);border-color:#3a4c5e}.secondary:hover:not(:disabled){background:#314559}.danger{background:#402b2d;color:#ffd3d3}.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}.stack{display:grid;gap:12px}.panel{background:var(--surface2);padding:20px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}.section-head h3{margin:0}.field{display:grid;gap:6px;min-width:0}.field label{font-size:12px;color:var(--muted);font-weight:650}input{background:#0e1721;color:var(--text);border:1px solid #405164;padding:11px 12px;border-radius:9px;width:100%;min-width:0;margin:0;font:inherit}input:focus{outline:2px solid #b87535;outline-offset:1px}a{color:#9ac9ff}a:hover{color:#d2e8ff}.url{display:block;overflow-wrap:anywhere;word-break:break-word;font-size:12px}.product-card{background:#111b26;border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:13px}.product-card h4{margin:0;font-size:15px}.badge{display:inline-flex;border:1px solid #6b5634;background:#3b3020;color:#ffd18d;border-radius:99px;padding:4px 10px;font-size:11px;font-weight:700}.notice{background:#172d35;border:1px solid #315767;border-radius:10px;padding:12px 14px;color:#c9e9f3;margin:12px 0}.warning{color:#ffc078}.form-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end}.product-fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:12px}.divider{height:1px;background:var(--line);margin:22px 0}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid var(--line)}#login{max-width:420px;margin:10vh auto}#refresh{margin-top:18px}.link-section{display:grid;gap:18px}[hidden]{display:none!important}@media(max-width:900px){aside{position:static;width:auto;padding:16px;height:auto}nav{display:flex;overflow-x:auto;margin:12px 0;gap:4px}nav a{white-space:nowrap}main{margin:0;padding:20px}.product-fields{grid-template-columns:1fr}}@media(max-width:540px){.form-row{grid-template-columns:1fr}.tile,section,.panel{padding:16px}main{padding:16px}.actions button{flex:1 1 auto}}
</style></head><body><div id="login" hidden><section><h1>🦊 FoxCore</h1><p>Acesso administrativo</p><form id="form"><label>Chave de acesso<input id="key" type="password" required autocomplete="current-password"></label><button>Entrar</button></form><p id="error" role="alert"></p></section></div><div id="app" hidden><aside><h1>🦊 FoxCore</h1><small>Central de inteligência autônoma</small><nav id="nav"></nav><button id="logout">Sair</button></aside><main><h2 id="title">Visão geral</h2><p id="status" role="status"></p><div id="metrics" class="grid"></div><section><h3 id="subtitle">Situação operacional</h3><div id="detail"></div></section><button id="refresh">Atualizar dados</button></main></div><script>const modules=[['Visão geral','overview'],['Mineração de ofertas','sources'],['Caçador de cupons','coupons'],['Monitoramento de preços','prices'],['Inteligência artificial','ai'],['Links de afiliados','links'],['Publicações automáticas','posts'],['Segurança e auditoria','audit'],['Relatórios e desempenho','reports']];const $=id=>document.getElementById(id);let key='',data={},active=modules.some(x=>'#'+x[1]===location.hash)?location.hash.slice(1):'overview';function node(tag,text,parent,cls){const el=document.createElement(tag);el.textContent=text;if(cls)el.className=cls;parent.append(el);return el}function render(){for(const a of $('nav').querySelectorAll('a'))a.classList.toggle('active',a.getAttribute('href')==='#'+active); $('title').textContent=modules.find(x=>x[1]===active)[0];$('metrics').replaceChildren();$('metrics').hidden=active!=='overview';for(const [label,value] of Object.entries(data.counts||{})){const card=node('div','',$('metrics'),'tile');node('small',label,card);node('div',String(value),card,'metric')}const d=$('detail');d.replaceChildren();if(active==='sources'){for(const s of data.sources||[])node('p',s.name+' — '+(s.enabled?'Ativa':'Desativada')+' / '+(s.authorized?'Autorizada':'Aguardando autorização'),d)}else if(active==='overview'){node('p',data.dry_run?'Modo de simulação ativo':'Modo de simulação desativado',d,'warning');node('p','Mineração: '+(data.mining?'Ativa':'Desativada')+' | Publicação: '+(data.publishing?'Ativa':'Desativada'),d)}else if(active==='links'){
const top=node('div','',d,'link-section');
const account=node('div','',top,'panel');node('h3','Conexão com Mercado Livre',account);node('p','Acesso oficial à conta. A geração automática de links com comissão ainda não foi comprovada.',account,'muted');
const connection=node('div','Consultando conexão...',account,'notice');const accountActions=node('div','',account,'actions');
const renew=node('button','Renovar token',accountActions,'secondary');renew.disabled=true;
const verifyAccount=node('button','Verificar acesso oficial',accountActions,'secondary');
const connect=node('button','Reconectar Mercado Livre',accountActions,'secondary');
const check=async()=>{try{const r=await fetch('/api/meli-status',{headers:{Authorization:'Bearer '+key},cache:'no-store'});const v=await r.json();if(!r.ok)throw Error('Consulta indisponível');connection.textContent=v.connected?'Conta conectada · Token '+(v.expired?'expirado':'válido')+' até '+new Date(v.expires_at).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'}):'Conta ainda não conectada';renew.disabled=!v.connected}catch(e){connection.textContent=e.message;renew.disabled=true}};
renew.onclick=async()=>{renew.disabled=true;try{const r=await fetch('/api/refresh-meli',{method:'POST',headers:{Authorization:'Bearer '+key}});const v=await r.json();if(!r.ok||!v.ok)throw Error(v.reason||'Falha na renovação');await check()}catch(e){connection.textContent=e.message}finally{renew.disabled=false}};check();
verifyAccount.onclick=async()=>{verifyAccount.disabled=true;try{const r=await fetch('/api/meli-verify',{headers:{Authorization:'Bearer '+key},cache:'no-store'});const v=await r.json();if(!r.ok||!v.ok)throw Error(v.reason||'Falha na verificação');connection.textContent=v.account_verified?'Conta validada pela API oficial ('+(v.site_id||'')+'). Permissão de afiliados via API não verificada.':'Conta não identificada'}catch(e){connection.textContent=e.message}finally{verifyAccount.disabled=false}};
connect.onclick=async()=>{connect.disabled=true;try{const r=await fetch('/api/auth/mercadolivre/start',{method:'POST',headers:{Authorization:'Bearer '+key}});const v=await r.json();if(!r.ok||!v.authorization_url)throw Error(v.erro||'Falha ao iniciar autorização');const u=new URL(v.authorization_url);if(u.origin!=='https://auth.mercadolivre.com.br')throw Error('Destino de autorização inválido');location.assign(u.href)}catch(e){connection.textContent=e.message;connect.disabled=false}};
const linksPanel=node('div','',top,'panel');node('h3','Meus links de afiliados',linksPanel);
const addForm=node('div','',linksPanel,'form-row');const addField=node('div','',addForm,'field');node('label','Novo link de afiliado',addField);const field=node('input','',addField);field.placeholder='https://meli.la/...';field.setAttribute('aria-label','Link gerado na Central de Afiliados');const add=node('button','Cadastrar link',addForm);const msg=node('div','',linksPanel);msg.setAttribute('role','status');const list=node('div','',linksPanel,'stack');list.style.marginTop='18px';
const listLinks=async()=>{const r=await fetch('/api/affiliate-links',{headers:{Authorization:'Bearer '+key},cache:'no-store'});if(!r.ok)throw Error('Não foi possível carregar links');const v=await r.json();list.replaceChildren();if(!v.links?.length)node('p','Nenhum link cadastrado.',list,'muted');for(const link of v.links||[]){
const card=node('div','',list,'product-card');const heading=node('div','',card,'section-head');node('h4',link.product_title||'Link sem produto associado',heading);node('span',link.verification_status==='pending'?'Aguardando validação':link.verification_status,heading,'badge');
const url=node('a',link.affiliate_url,card,'url');url.href=link.affiliate_url;url.target='_blank';url.rel='noopener noreferrer';
if(link.product_url){const product=node('a','Abrir produto no Mercado Livre',card,'url');product.href=link.product_url;product.target='_blank';product.rel='noopener noreferrer'}
const fields=node('div','',card,'product-fields');const titleField=node('div','',fields,'field');node('label','Nome do produto',titleField);const titleInput=node('input','',titleField);titleInput.value=link.product_title||'';titleInput.placeholder='Nome do produto';
const productField=node('div','',fields,'field');node('label','Endereço oficial do produto',productField);const productInput=node('input','',productField);productInput.value=link.product_url||'';productInput.placeholder='https://produto.mercadolivre.com.br/...';
const actions=node('div','',card,'actions');const save=node('button','Salvar produto',actions);const verify=node('button','Verificar destino',actions,'secondary');
save.onclick=async()=>{save.disabled=true;try{const response=await fetch('/api/affiliate-links',{method:'PATCH',headers:{Authorization:'Bearer '+key,'Content-Type':'application/json'},body:JSON.stringify({id:link.id,product_url:productInput.value.trim(),product_title:titleInput.value.trim()})});const result=await response.json();if(!response.ok||!result.ok)throw Error(result.reason||'Falha ao salvar');msg.className='notice';msg.textContent='Produto salvo. Comissão ainda não verificada.';await listLinks()}catch(e){msg.className='warning';msg.textContent=e.message}finally{save.disabled=false}};
verify.onclick=async()=>{verify.disabled=true;try{const response=await fetch('/api/affiliate-links',{method:'PUT',headers:{Authorization:'Bearer '+key,'Content-Type':'application/json'},body:JSON.stringify({id:link.id})});const result=await response.json();if(!response.ok)throw Error(result.reason||'Falha na verificação');msg.className='notice';msg.textContent=result.destination_matches?'Destino corresponde ao produto. Comissão ainda não verificada.':'Verificação inconclusiva: '+({provider_blocked:'Mercado Livre bloqueou a consulta automática',different_product:'o destino aponta para outro produto',unsupported_redirect_domain:'o redirecionamento usa um domínio não reconhecido',destination_unconfirmed:'a página não revelou o código do produto',redirect_not_confirmed:'a cadeia de redirecionamento não foi concluída',redirect_check_failed:'falha de rede ou tempo esgotado',provider_http_error:'erro HTTP do provedor'}[result.reason]||result.reason)+'. Comissão ainda não verificada.'}catch(e){msg.className='warning';msg.textContent=e.message}finally{verify.disabled=false}};
}};
add.onclick=async()=>{add.disabled=true;try{const r=await fetch('/api/affiliate-links',{method:'POST',headers:{Authorization:'Bearer '+key,'Content-Type':'application/json'},body:JSON.stringify({affiliate_url:field.value.trim()})});const v=await r.json();if(!r.ok)throw Error(v.reason||'Falha no cadastro');field.value='';msg.className='notice';msg.textContent='Link cadastrado. Aguardando validação.';await listLinks()}catch(e){msg.className='warning';msg.textContent=e.message}finally{add.disabled=false}};listLinks().catch(e=>{msg.className='warning';msg.textContent=e.message});
}else{node('p','Módulo em implantação. Os dados consolidados aparecem na visão geral.',d)} }async function load(){const r=await fetch('/api/status',{headers:{Authorization:'Bearer '+key},cache:'no-store'});if(!r.ok)throw Error(r.status===401?'Chave inválida.':'Serviço ainda não configurado ou indisponível.');data=await r.json();$('status').textContent='Atualizado em '+new Date().toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'});render()}for(const [label,id] of modules){const a=node('a',label,$('nav'));a.href='#'+id;a.onclick=()=>{active=id;render()}}async function enter(){await load();$('key').value='';$('error').textContent='';$('login').hidden=true;$('app').hidden=false}
$('form').onsubmit=async e=>{e.preventDefault();key=$('key').value;try{await enter();sessionStorage.setItem('foxcore_admin_session',key)}catch(e){key='';sessionStorage.removeItem('foxcore_admin_session');$('error').textContent=e.message}};
try{key=sessionStorage.getItem('foxcore_admin_session')||''}catch(_){}
if(key){enter().catch(()=>{key='';sessionStorage.removeItem('foxcore_admin_session');$('login').hidden=false;$('app').hidden=true})}else{$('login').hidden=false}$('refresh').onclick=()=>load().catch(e=>$('status').textContent=e.message);$('logout').onclick=()=>{key='';sessionStorage.removeItem('foxcore_admin_session');location.reload()};</script></body></html>
