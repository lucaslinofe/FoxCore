<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FoxCore</title><style>
:root{color-scheme:dark;--bg:#0b1017;--sidebar:#111923;--surface:#151f2b;--surface2:#1b2937;--line:#2c3b4b;--text:#edf3f9;--muted:#a3b2c1;--accent:#f59a43;--accent-hover:#ffb46e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}aside{background:var(--sidebar);padding:28px 18px;width:244px;position:fixed;inset:0 auto 0 0;overflow:auto;border-right:1px solid var(--line)}aside h1{color:var(--accent);font-size:23px;margin:0 0 2px}aside small{font-size:11px}nav{display:grid;gap:4px;margin:24px 0}nav a{display:block;padding:11px 12px;color:var(--muted);text-decoration:none;border-radius:9px;font-weight:550}nav a:hover,nav a.active{background:#283746;color:#fff}nav a.active{box-shadow:inset 3px 0 var(--accent)}main{margin-left:244px;padding:34px clamp(18px,3vw,48px);max-width:1650px}h2{font-size:25px;margin:0 0 2px}h3{font-size:16px;margin:0 0 16px}p{margin:8px 0 14px}small,.muted{color:var(--muted)}#status{color:var(--muted);font-size:12px;margin:0 0 24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:14px}.tile,section,.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}.tile small{font-size:12px}.metric{font-size:30px;font-weight:700;color:var(--accent);margin-top:10px}section{margin-top:20px}button{background:var(--accent);color:#201408;border:1px solid transparent;border-radius:9px;padding:10px 15px;font-weight:700;cursor:pointer;min-height:40px}button:hover:not(:disabled){background:var(--accent-hover)}button:disabled{opacity:.55;cursor:not-allowed}.secondary{background:#253445;color:var(--text);border-color:#3a4c5e}.secondary:hover:not(:disabled){background:#314559}.danger{background:#402b2d;color:#ffd3d3}.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}.stack{display:grid;gap:12px}.panel{background:var(--surface2);padding:20px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}.section-head h3{margin:0}.field{display:grid;gap:6px;min-width:0}.field label{font-size:12px;color:var(--muted);font-weight:650}input{background:#0e1721;color:var(--text);border:1px solid #405164;padding:11px 12px;border-radius:9px;width:100%;min-width:0;margin:0;font:inherit}input:focus{outline:2px solid #b87535;outline-offset:1px}a{color:#9ac9ff}a:hover{color:#d2e8ff}.url{display:block;overflow-wrap:anywhere;word-break:break-word;font-size:12px}.product-card{background:#111b26;border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:13px}.product-card h4{margin:0;font-size:15px}.badge{display:inline-flex;border:1px solid #6b5634;background:#3b3020;color:#ffd18d;border-radius:99px;padding:4px 10px;font-size:11px;font-weight:700}.notice{background:#172d35;border:1px solid #315767;border-radius:10px;padding:12px 14px;color:#c9e9f3;margin:12px 0}.warning{color:#ffc078}.form-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end}.product-fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:12px}.divider{height:1px;background:var(--line);margin:22px 0}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid var(--line)}#login{max-width:420px;margin:10vh auto}#refresh{margin-top:18px}.link-section{display:grid;gap:18px}[hidden]{display:none!important}@media(max-width:900px){aside{position:static;width:auto;padding:16px;height:auto}nav{display:flex;overflow-x:auto;margin:12px 0;gap:4px}nav a{white-space:nowrap}main{margin:0;padding:20px}.product-fields{grid-template-columns:1fr}}@media(max-width:540px){.form-row{grid-template-columns:1fr}.tile,section,.panel{padding:16px}main{padding:16px}.actions button{flex:1 1 auto}}
</style></head><body><div id="login" hidden><section><h1>🦊 FoxCore</h1><p>Acesso administrativo</p><form id="form"><label>Chave de acesso<input id="key" type="password" required autocomplete="current-password"></label><button>Entrar</button></form><p id="error" role="alert"></p></section></div><div id="app" hidden><aside><h1>🦊 FoxCore</h1><small>Central de inteligência autônoma</small><nav id="nav"></nav><button id="logout">Sair</button></aside><main><h2 id="title">Visão geral</h2><p id="status" role="status"></p><div id="metrics" class="grid"></div><section><h3 id="subtitle">Situação operacional</h3><div id="detail"></div></section><button id="refresh">Atualizar dados</button></main></div><script>const modules=[['Visão geral','overview'],['Shopee — Ofertas','links'],['Mercado Livre — Top 10','meli-top10'],['Publicações WhatsApp','posts'],['Segurança e auditoria','audit'],['Relatórios e desempenho','reports']];const $=id=>document.getElementById(id);let key='',data={},active=modules.some(x=>'#'+x[1]===location.hash)?location.hash.slice(1):'overview';function node(tag,text,parent,cls){const el=document.createElement(tag);el.textContent=text;if(cls)el.className=cls;parent.append(el);return el}function render(){for(const a of $('nav').querySelectorAll('a'))a.classList.toggle('active',a.getAttribute('href')==='#'+active); $('title').textContent=modules.find(x=>x[1]===active)[0];$('metrics').replaceChildren();$('metrics').hidden=active!=='overview';for(const [label,value] of Object.entries(data.counts||{})){const card=node('div','',$('metrics'),'tile');node('small',label,card);node('div',String(value),card,'metric')}const d=$('detail');d.replaceChildren();if(active==='sources'){for(const s of data.sources||[])node('p',s.name+' — '+(s.enabled?'Ativa':'Desativada')+' / '+(s.authorized?'Autorizada':'Aguardando autorização'),d)}else if(active==='overview'){const jump=node('button','Ver ofertas e monitoramento de preços',d,'secondary');jump.onclick=()=>{active='links';location.hash='links';render()};node('p','A operação atual está focada exclusivamente em ofertas Shopee.',d,'muted');node('p',data.dry_run?'Modo de simulação ativo':'Modo de simulação desativado',d,'warning');node('p','Mineração: '+(data.mining?'Ativa':'Desativada')+' | Publicação: '+(data.publishing?'Ativa':'Desativada'),d)}else if(active==='meli-top10'){
const box=node('div','',d,'panel');node('h3','Teste: 10 mais vendidos por categoria',box);node('p','Consulta direta à API oficial de destaques do Mercado Livre. Não utiliza Pechinchou ou Promobit. A listagem não comprova desconto nem comissão.',box,'muted');
const selector=node('select','',box);selector.style.cssText='background:#0e1721;color:#edf3f9;padding:11px;border:1px solid #405164;border-radius:9px;max-width:320px;width:100%';
for(const [value,label] of [['celulares','Celulares'],['eletronicos','Eletrônicos'],['casa','Casa'],['informatica','Informática']]){const option=node('option',label,selector);option.value=value}
const result=node('div','Aguardando consulta...',box,'notice');const list=node('div','',box,'stack');const go=node('button','Consultar 10 produtos',box,'secondary');
go.onclick=async()=>{go.disabled=true;list.replaceChildren();result.textContent='Consultando API oficial...';try{const r=await fetch('/api/affiliate-links?action=meli_top10&category='+encodeURIComponent(selector.value),{headers:{Authorization:'Bearer '+key},cache:'no-store'});const v=await r.json();if(!r.ok||!v.ok)throw Error(v.reason||'Consulta indisponível');result.textContent=v.status==='ranking_ids_available'?v.items.length+' produtos identificados. Preços, descontos e links de afiliados ainda não validados.':'Consulta: '+v.status+(v.http_status?' (HTTP '+v.http_status+')':'');for(const p of v.items||[]){const item=node('div','',list,'product-card');node('strong','#'+p.rank+' · '+p.product_code,item);node('p','Identificador obtido na API; aguardando detalhes oficiais.',item,'muted')}}catch(e){result.textContent=e.message}finally{go.disabled=false}};
}else if(active==='links'){
const top=node('div','',d,'link-section');
const intro=node('div','',top,'panel');node('h3','Operação Shopee',intro);node('p','Área exclusiva para ofertas Shopee. A interface do Mercado Livre e suas filas foram ocultadas, sem apagar dados ou credenciais antigos.',intro,'muted');
const status=node('div','Verificando integração Shopee...',intro,'notice');
const refreshStatus=node('button','Verificar integração',intro,'secondary');
const details=node('div','',top,'panel');node('h3','Fluxo de ofertas',details);
for(const [n,t] of [['1. Captura','Receber ofertas de produtos individuais do Promobit ou de outra fonte autorizada.'],['2. Identificação','Resolver o link até a página exata do produto Shopee e conferir título e preço.'],['3. Link próprio','Gerar link pela conta Shopee Afiliados conectada; nunca reutilizar o rastreamento do Promobit.'],['4. Divulgação','Preparar a mensagem e enviar ao canal WhatsApp após validação.']]){node('strong',n,details);node('p',t,details,'muted')}
const queue=node('div','',top,'panel');node('h3','Fila de ofertas Shopee',queue);const queueText=node('p','Aguardando integração de captura Shopee.',queue,'muted');
const checkShopee=async()=>{refreshStatus.disabled=true;try{const r=await fetch('/api/shopee-status',{headers:{Authorization:'Bearer '+key},cache:'no-store'});const v=await r.json();if(!r.ok||!v.ok)throw Error(v.reason||'Status indisponível');status.textContent=v.connected?'Credenciais Shopee localizadas · acesso à API ainda não validado':'Credenciais Shopee não localizadas neste ambiente do painel; verifique a configuração do serviço Render.';queueText.textContent=v.queue_ready?'Fila Shopee disponível.':'A fila Shopee ainda não está configurada. Nenhuma oferta será capturada ou publicada até a integração ser validada.';if(v.credential_source)node('p','Conexão detectada em: '+v.credential_source,intro,'muted')}catch(e){status.textContent='Não foi possível verificar a integração: '+e.message}finally{refreshStatus.disabled=false}};
refreshStatus.onclick=checkShopee;checkShopee();

}else{node('p','Módulo em implantação. Os dados consolidados aparecem na visão geral.',d)} }async function load(){const r=await fetch('/api/status',{headers:{Authorization:'Bearer '+key},cache:'no-store'});if(!r.ok)throw Error(r.status===401?'Chave inválida.':'Serviço ainda não configurado ou indisponível.');data=await r.json();$('status').textContent='Atualizado em '+new Date().toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'});render()}for(const [label,id] of modules){const a=node('a',label,$('nav'));a.href='#'+id;a.onclick=()=>{active=id;render()}}async function enter(){await load();$('key').value='';$('error').textContent='';$('login').hidden=true;$('app').hidden=false}
$('form').onsubmit=async e=>{e.preventDefault();key=$('key').value;try{await enter();sessionStorage.setItem('foxcore_admin_session',key)}catch(e){key='';sessionStorage.removeItem('foxcore_admin_session');$('error').textContent=e.message}};
try{key=sessionStorage.getItem('foxcore_admin_session')||''}catch(_){}
if(key){enter().catch(()=>{key='';sessionStorage.removeItem('foxcore_admin_session');$('login').hidden=false;$('app').hidden=true})}else{$('login').hidden=false}$('refresh').onclick=()=>load().catch(e=>$('status').textContent=e.message);$('logout').onclick=()=>{key='';sessionStorage.removeItem('foxcore_admin_session');location.reload()};</script></body></html>
