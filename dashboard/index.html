<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FoxCore</title><style>*{box-sizing:border-box}body{margin:0;background:#111;color:#eee;font:16px system-ui}aside{background:#191919;padding:24px;width:250px;position:fixed;height:100%;overflow:auto}h1{color:#ff963b;font-size:25px}nav a{display:block;padding:12px;color:#ddd;text-decoration:none;border-radius:8px}nav a:hover{background:#333}main{margin-left:250px;padding:32px;max-width:1400px}h2{margin-top:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.tile,section{background:#202020;border:1px solid #383838;border-radius:12px;padding:20px}.metric{font-size:30px;color:#ff963b;margin-top:12px}section{margin-top:20px}small{color:#bbb}.warning{color:#ffc078}button{background:#ff963b;color:#171717;border:0;border-radius:8px;padding:12px;font-weight:bold;cursor:pointer}input{background:#111;color:white;border:1px solid #777;padding:12px;border-radius:8px;width:100%;margin:8px 0}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #444}#login{max-width:420px;margin:10vh auto} [hidden]{display:none!important}@media(max-width:720px){aside{position:static;width:auto;height:auto;padding:12px}nav{display:flex;overflow:auto}nav a{white-space:nowrap}main{margin:0;padding:16px}}</style></head><body><div id="login" hidden><section><h1>🦊 FoxCore</h1><p>Acesso administrativo</p><form id="form"><label>Chave de acesso<input id="key" type="password" required autocomplete="current-password"></label><button>Entrar</button></form><p id="error" role="alert"></p></section></div><div id="app" hidden><aside><h1>🦊 FoxCore</h1><small>Central de inteligência autônoma</small><nav id="nav"></nav><button id="logout">Sair</button></aside><main><h2 id="title">Visão geral</h2><p id="status" role="status"></p><div id="metrics" class="grid"></div><section><h3 id="subtitle">Situação operacional</h3><div id="detail"></div></section><button id="refresh">Atualizar dados</button></main></div><script>const modules=[['Visão geral','overview'],['Mineração de ofertas','sources'],['Caçador de cupons','coupons'],['Monitoramento de preços','prices'],['Inteligência artificial','ai'],['Links de afiliados','links'],['Publicações automáticas','posts'],['Segurança e auditoria','audit'],['Relatórios e desempenho','reports']];const $=id=>document.getElementById(id);let key='',data={},active=modules.some(x=>'#'+x[1]===location.hash)?location.hash.slice(1):'overview';function node(tag,text,parent,cls){const el=document.createElement(tag);el.textContent=text;if(cls)el.className=cls;parent.append(el);return el}function render(){ $('title').textContent=modules.find(x=>x[1]===active)[0];$('metrics').replaceChildren();for(const [label,value] of Object.entries(data.counts||{})){const card=node('div','',$('metrics'),'tile');node('small',label,card);node('div',String(value),card,'metric')}const d=$('detail');d.replaceChildren();if(active==='sources'){for(const s of data.sources||[])node('p',s.name+' — '+(s.enabled?'Ativa':'Desativada')+' / '+(s.authorized?'Autorizada':'Aguardando autorização'),d)}else if(active==='overview'){node('p',data.dry_run?'Modo de simulação ativo':'Modo de simulação desativado',d,'warning');node('p','Mineração: '+(data.mining?'Ativa':'Desativada')+' | Publicação: '+(data.publishing?'Ativa':'Desativada'),d)}else if(active==='links'){node('p','Conecte sua conta Mercado Livre para autorizar o acesso oficial via OAuth. Isso não ativa publicações nem garante acesso à API de afiliados.',d);const status=node('p','Consultando conexão Mercado Livre...',d);const refresh=node('button','Testar renovação do token',d);refresh.disabled=true;const check=async()=>{try{const r=await fetch('/api/meli-status',{headers:{Authorization:'Bearer '+key},cache:'no-store'});const v=await r.json();if(!r.ok)throw Error('Consulta indisponível');status.textContent=v.connected?'Mercado Livre conectado. Token '+(v.expired?'expirado':'válido')+' até '+new Date(v.expires_at).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'}):'Mercado Livre ainda não conectado';refresh.disabled=!v.connected}catch(e){status.textContent=e.message;refresh.disabled=true}};refresh.onclick=async()=>{refresh.disabled=true;refresh.textContent='Renovando...';try{const r=await fetch('/api/refresh-meli',{method:'POST',headers:{Authorization:'Bearer '+key}});const v=await r.json();if(!r.ok||!v.ok)throw Error('Renovação não concluída: '+(v.reason||r.status));await check()}catch(e){status.textContent=e.message}finally{refresh.textContent='Testar renovação do token';refresh.disabled=false}};check();const verify=node('button','Verificar acesso oficial',d);verify.onclick=async()=>{verify.disabled=true;verify.textContent='Verificando...';try{const r=await fetch('/api/meli-verify',{headers:{Authorization:'Bearer '+key},cache:'no-store'});const v=await r.json();if(!r.ok||!v.ok)throw Error('Verificação não concluída: '+(v.reason||r.status));node('p',v.account_verified?'Conta Mercado Livre validada pela API oficial ('+(v.site_id||'site não informado')+'). Permissão de geração de links de afiliados ainda não verificada.':'Resposta oficial sem identificação de conta.',d)}catch(e){node('p',e.message,d,'warning')}finally{verify.disabled=false;verify.textContent='Verificar acesso oficial'}};node('h3','Meus links de afiliados',d);const field=node('input','',d);field.placeholder='https://meli.la/...';field.setAttribute('aria-label','Link gerado na Central de Afiliados');const add=node('button','Cadastrar link',d);const msg=node('p','',d);const list=node('div','',d);const listLinks=async()=>{const r=await fetch('/api/affiliate-links',{headers:{Authorization:'Bearer '+key},cache:'no-store'});if(!r.ok)throw Error('Não foi possível carregar links');const v=await r.json();list.replaceChildren();for(const link of v.links||[]){const p=node('p','',list);const a=node('a',link.affiliate_url,p);a.href=link.affiliate_url;a.target='_blank';a.rel='noopener noreferrer';node('small',' — '+(link.verification_status==='pending'?'Aguardando validação':link.verification_status),p)}};add.onclick=async()=>{add.disabled=true;try{const r=await fetch('/api/affiliate-links',{method:'POST',headers:{Authorization:'Bearer '+key,'Content-Type':'application/json'},body:JSON.stringify({affiliate_url:field.value.trim()})});const v=await r.json();if(!r.ok)throw Error(v.reason||'Falha no cadastro');field.value='';msg.textContent='Link cadastrado. Aguardando validação.';await listLinks()}catch(e){msg.textContent=e.message}finally{add.disabled=false}};listLinks().catch(e=>msg.textContent=e.message);const btn=node('button','Conectar Mercado Livre',d);btn.onclick=async()=>{btn.disabled=true;btn.textContent='Preparando autorização...';try{const r=await fetch('/api/auth/mercadolivre/start',{method:'POST',headers:{Authorization:'Bearer '+key}});const v=await r.json();if(!r.ok||!v.authorization_url)throw Error(v.erro||'Não foi possível iniciar autorização');const u=new URL(v.authorization_url);if(u.origin!=='https://auth.mercadolivre.com.br')throw Error('Destino de autorização inválido');location.assign(u.href)}catch(e){btn.disabled=false;btn.textContent='Conectar Mercado Livre';node('p',e.message,d,'warning')}}}else{node('p','Módulo em implantação. Os dados consolidados aparecem na visão geral.',d)} }async function load(){const r=await fetch('/api/status',{headers:{Authorization:'Bearer '+key},cache:'no-store'});if(!r.ok)throw Error(r.status===401?'Chave inválida.':'Serviço ainda não configurado ou indisponível.');data=await r.json();$('status').textContent='Atualizado em '+new Date().toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'});render()}for(const [label,id] of modules){const a=node('a',label,$('nav'));a.href='#'+id;a.onclick=()=>{active=id;render()}}$('login').hidden=false;async function enter(){await load();$('key').value='';$('error').textContent='';$('login').hidden=true;$('app').hidden=false}
$('form').onsubmit=async e=>{e.preventDefault();key=$('key').value;try{await enter();sessionStorage.setItem('foxcore_admin_session',key)}catch(e){key='';sessionStorage.removeItem('foxcore_admin_session');$('error').textContent=e.message}};
try{key=sessionStorage.getItem('foxcore_admin_session')||''}catch(_){}
if(key){enter().catch(()=>{key='';sessionStorage.removeItem('foxcore_admin_session');$('login').hidden=false;$('app').hidden=true})}$('refresh').onclick=()=>load().catch(e=>$('status').textContent=e.message);$('logout').onclick=()=>{key='';sessionStorage.removeItem('foxcore_admin_session');location.reload()};</script></body></html>
