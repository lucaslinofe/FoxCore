onitoramento de preços',d,'secondary');jump.onclick=()=>{active='links';location.hash='links';render()};node('p','A operação atual está focada exclusivamente em ofertas Shopee.',d,'muted');node('p',data.dry_run?'Modo de simulação ativo':'Modo de simulação desativado',d,'warning');node('p','Mineração: '+(data.mining?'Ativa':'Desativada')+' | Publicação: '+(data.publishing?'Ativa':'Desativada'),d)}else if(active==='manus'){
const box=node('div','',d,'panel');node('h3','Fila Manus · Identificação de produtos',box);node('p','Envio manual de uma oferta por vez. O Manus pode consumir créditos. Nenhum produto é publicado automaticamente.',box,'muted');
const testPanel=node('div','',box,'panel');node('h3','Teste de uma nova oferta',testPanel);node('p','Selecione uma oferta pendente. O teste envia somente o item escolhido; pode consumir créditos do Manus.',testPanel,'muted');const testSelect=node('select','',testPanel);testSelect.style.maxWidth='100%';const testButton=node('button','Testar oferta selecionada',testPanel,'secondary');testButton.disabled=true;const testStatus=node('p','Carregando ofertas pendentes...',testPanel,'muted');const loadTestOffers=async()=>{try{const r=await fetch('/api/affiliate-links?action=pechinchou_queue',{headers:{Authorization:'Bearer '+key},cache:'no-store'});const v=await r.json();if(!r.ok||!v.ok)throw Error(v.reason||'Fila indisponível');testSelect.replaceChildren();const offers=(v.offers||[]).filter(o=>!o.product_url&&!o.product_code&&o.status!=='resolved');for(const o of offers){const option=document.createElement('option');option.value=o.id||o.short_url||'';option.textContent=(o.title||'Oferta')+' — '+(o.short_url||o.storefront_url||'');option.dataset.url=o.short_url||o.storefront_url||'';testSelect.append(option)}testButton.disabled=!offers.length;testStatus.textContent=offers.length+' ofertas aguardando identificação. Selecione apenas uma.'}catch(e){testStatus.textContent='Não foi possível carregar ofertas: '+e.message}};testButton.onclick=async()=>{const selected=testSelect.selectedOptions[0];if(!selected)return;const id=testSelect.value;if(!id){testStatus.textContent='Oferta sem identificador; não é possível enviar com segurança.';return}if(!confirm('Enviar somente esta oferta ao Manus? A tarefa pode consumir créditos.'))return;testButton.disabled=true;testStatus.textContent='Solicitando identificação ao Manus...';try{const r=await fetch('/api/affiliate-links?action=manus_dispatch',{method:'POST',headers:{Authorization:'Bearer '+key,'Content-Type':'application/json'},body:JSON.stringify({job_id:id,short_url:selected.dataset.url})});const v=await r.json();if(!r.ok||!v.ok)throw Error(v.reason||'Backend não aceitou o envio desta oferta');testStatus.textContent='Solicitação aceita: '+(v.manus_task_id||'verifique a fila abaixo');await refresh();await loadTestOffers()}catch(e){testStatus.textContent='Teste não enviado: '+e.message+'. A integração do backend precisa aceitar ofertas da fila Pechinchou.'}finally{testButton.disabled=false}};loadTestOffers();
