<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FoxCore</title><style>
:root{color-scheme:dark;--bg:#0b1017;--sidebar:#111923;--surface:#151f2b;--surface2:#1b2937;--line:#2c3b4b;--text:#edf3f9;--muted:#a3b2c1;--accent:#f59a43;--accent-hover:#ffb46e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}aside{background:var(--sidebar);padding:28px 18px;width:244px;position:fixed;inset:0 auto 0 0;overflow:auto;border-right:1px solid var(--line)}aside h1{color:var(--accent);font-size:23px;margin:0 0 2px}aside small{font-size:11px}nav{display:grid;gap:4px;margin:24px 0}nav a{display:block;padding:11px 12px;color:var(--muted);text-decoration:none;border-radius:9px;font-weight:550}nav a:hover,nav a.active{background:#283746;color:#fff}nav a.active{box-shadow:inset 3px 0 var(--accent)}main{margin-left:244px;padding:34px clamp(18px,3vw,48px);max-width:1650px}h2{font-size:25px;margin:0 0 2px}h3{font-size:16px;margin:0 0 16px}p{margin:8px 0 14px}small,.muted{color:var(--muted)}#status{color:var(--muted);font-size:12px;margin:0 0 24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:14px}.tile,section,.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}.tile small{font-size:12px}.metric{font-size:30px;font-weight:700;color:var(--accent);margin-top:10px}section{margin-top:20px}button{background:var(--accent);color:#201408;border:1px solid transparent;border-radius:9px;padding:10px 15px;font-weight:700;cursor:pointer;min-height:40px}button:hover:not(:disabled){background:var(--accent-hover)}button:disabled{opacity:.55;cursor:not-allowed}.secondary{background:#253445;color:var(--text);border-color:#3a4c5e}.secondary:hover:not(:disabled){background:#314559}.danger{background:#402b2d;color:#ffd3d3}.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}.stack{display:grid;gap:12px}.panel{background:var(--surface2);padding:20px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}.section-head h3{margin:0}.field{display:grid;gap:6px;min-width:0}.field label{font-size:12px;color:var(--muted);font-weight:650}input{background:#0e1721;color:var(--text);border:1px solid #405164;padding:11px 12px;border-radius:9px;width:100%;min-width:0;margin:0;font:inherit}input:focus{outline:2px solid #b87535;outline-offset:1px}a{color:#9ac9ff}a:hover{color:#d2e8ff}.url{display:block;overflow-wrap:anywhere;word-break:break-word;font-size:12px}.product-card{background:#111b26;border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:13px}.product-card h4{margin:0;font-size:15px}.badge{display:inline-flex;border:1px solid #6b5634;background:#3b3020;color:#ffd18d;border-radius:99px;padding:4px 10px;font-size:11px;font-weight:700}.notice{background:#172d35;border:1px solid #315767;border-radius:10px;padding:12px 14px;color:#c9e9f3;margin:12px 0}.warning{color:#ffc078}.form-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end}.product-fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:12px}.divider{height:1px;background:var(--line);margin:22px 0}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid var(--line)}#login{max-width:420px;margin:10vh auto}#refresh{margin-top:18px}.link-section{display:grid;gap:18px}[hidden]{display:none!important}@media(max-width:900px){aside{position:static;width:auto;padding:16px;height:auto}nav{display:flex;overflow-x:auto;margin:12px 0;gap:4px}nav a{white-space:nowrap}main{margin:0;padding:20px}.product-fields{grid-template-columns:1fr}}@media(max-width:540px){.form-row{grid-template-columns:1fr}.tile,section,.panel{padding:16px}main{padding:16px}.actions button{flex:1 1 auto}}
</style></head><body><div id="login" hidden><section><h1>🦊 FoxCore</h1><p>Acesso administrativo</p><form id="form"><label>Chave de acesso<input id="key" type="password" required autocomplete="current-password"></label><button>Entrar</button></form><p id="error" role="alert"></p></section></div><div id="app" hidden><aside><h1>🦊 FoxCore</h1><small>Central de inteligência autônoma</small><nav id="nav"></nav><button id="logout">Sair</button></aside><main><h2 id="title">Visão geral</h2><p id="status" role="status"></p><div id="metrics" class="grid"></div><section><h3 id="subtitle">Situação operacional</h3><div id="detail"></div></section><button id="refresh">Atualizar dados</button></main></div><script>const modules=[['Visão geral','overview'],['Mineração de ofertas','sources'],['Caçador de cupons','coupons'],['Monitoramento de preços','prices'],['Inteligência artificial','ai'],['Links de afiliados','links'],['Publicações automáticas','posts'],['Segurança e auditoria','audit'],['Relatórios e desempenho','reports']];const $=id=>document.getElementById(id);let key='',data={},active=modules.some(x=>'#'+x[1]===location.hash)?location.hash.slice(1):'overview';function node(tag,text,parent,cls){const el=document.createElement(tag);el.textContent=text;if(cls)el.className=cls;parent.append(el);return el}function render(){for(const a of $('nav').querySelectorAll('a'))a.classList.toggle('active',a.getAttribute('href')==='#'+active); $('title').textContent=modules.find(x=>x[1]===active)[0];$('metrics').replaceChildren();$('metrics').hidden=active!=='overview';for(const [label,value] of Object.entries(data.counts||{})){const card=node('div','',$('metrics'),'tile');node('small',label,card);node('div',String(value),card,'metric')}const d=$('detail');d.replaceChildren();if(active==='sources'){for(const s of data.sources||[])node('p',s.name+' — '+(s.enabled?'Ativa':'Desativada')+' / '+(s.authorized?'Autorizada':'Aguardando autorização'),d)}else if(active==='overview'){const jump=node('button','Ver ofertas e monitoramento de preços',d,'secondary');jump.onclick=()=>{active='links';location.hash='links';render()};node('p','Os rascunhos e preços monitorados ficam na aba Links de afiliados.',d,'muted');node('p',data.dry_run?'Modo de simulação ativo':'Modo de simulação desativado',d,'warning');node('p','Mineração: '+(data.mining?'Ativa':'Desativada')+' | Publicação: '+(data.publishing?'Ativa':'Desativada'),d)}else if(active==='links'){
const top=node('div','',d,'link-section');
const account=node('div','',top,'panel');node('h3','Conexão com Mercado Livre',account);node('p','Acesso oficial à conta. A geração automática de links com comissão ainda não foi comprovada.',account,'muted');
const connection=node('div','Consultando conexão...',account,'notice');const accountActions=node('div','',account,'actions');
const renew=node('button','Renovar token',accountActions,'secondary');renew.disabled=true;
const verifyAccount=node('button','Verificar acesso oficial',accountActions,'secondary');
const connect=node('button','Reconectar Mercado Livre',accountActions,'secondary');
const check=async()=>{try{const r=await fetch('/api/meli-status',{headers:{Authorization:'Bearer '+key},cache:'no-store'});const v=await r.json();if(!r.ok)throw Error('Consulta indisponível');connection.textContent=v.connected?'Conta conectada · Token '+(v.expired?'expirado':'válido')+' até '+new Date(v.expires_at).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'}):'Conta ainda não conectada';renew.disabled=!v.connected}catch(e){connection.textContent=e.message;renew.disabled=true}};
renew.onclick=async()=>{renew.disabled=true;try{const r=await fetch('/api/refresh-meli',{method:'POST',headers:{Authorization:'Bearer '+key}});const v=await r.json();if(!r.ok||!v.ok)throw Error(v.reason||'Falha na renovação');await check()}catch(e){connection.textContent=e.message}finally{renew.disabled=false}};check();
verifyAccount.onclick=async()=>{verifyAccount.disabled=true;try{const r=await fetch('/api/meli-verify',{headers:{Authorization:'Bearer '+key},cache:'no-store'});const v=await r.json();if(!r.ok||!v.ok)throw Error(v.reason||'Falha na verificação');connection.textContent=v.account_verified?'Conta validada pela API oficial ('+(v.site_id||'')+'). Permissão de afiliados via API não verificada.':'Conta não identificada'}catch(e){connection.textContent=e.message}finally{verifyAccount.disabled=false}};
connect.onclick=async()=>{connect.disabled=true;try{const r=await fetch('/api/auth/mercadolivre/start',{method:'POST',headers:{Authorization:'Bearer '+key}});const v=await r.json();if(!r.ok||!v.authorization_url)throw Error(v.erro||'Falha ao iniciar autorização');const u=new URL(v.authorization_url);if(u.origin!=='https://auth.mercadolivre.com.br')throw Error('Destino de autorização inválido');location.assign(u.href)}catch(e){connection.textContent=e.message;connect.disabled=false}};
const discoveryPanel=node('div','',top,'panel');node('h3','Produtos descobertos no Pechinchou',discoveryPanel);node('p','Fila separada de produtos do Mercado Livre. Links de terceiros nunca são tratados como seus links de afiliado.',discoveryPanel,'muted');const discoveryList=node('div','Consultando produtos...',discoveryPanel,'stack');fetch('/api/affiliate-links?action=discovered_products',{headers:{Authorization:'Bearer '+key},cache:'no-store'}).then(async r=>{const t=await r.text();let data;try{data=JSON.parse(t)}catch{throw Error('Servidor retornou HTTP '+r.status+' em vez de JSON')};if(!r.ok)throw Error('Erro HTTP '+r.status+': '+(data.reason||'Falha no servidor'));return data}).then(v=>{discoveryList.replaceChildren();if(!v.ok)throw Error('Fila indisponível');if(!v.products.length)node('p','Nenhum produto coletado. Coleta automática ainda desativada.',discoveryList,'muted');for(const p of v.products){const c=node('div','',discoveryList,'product-card');node('strong',p.title||p.product_code,c);node('p',p.product_code+' · Aguardando link da sua conta',c,'muted')}}).catch(e=>{discoveryList.textContent=e.message});
const probePanel=node('div','',top,'panel');node('h3','Diagnóstico da coleta Pechinchou',probePanel);const probeText=node('p','Aguardando verificação...',probePanel,'muted');const probeButton=node('button','Testar acesso à fonte',probePanel,'secondary');probeButton.onclick=async()=>{probeButton.disabled=true;probeText.textContent='Verificando...';try{const r=await fetch('/api/affiliate-links?action=pechinchou_probe',{headers:{Authorization:'Bearer '+key},cache:'no-store'});const v=await r.json();probeText.textContent=v.ok?'Acesso HTML: '+(v.html_accessible?'sim':'não')+' · HTTP: '+(v.http_status||'indisponível')+' · Links Mercado Livre: '+(v.mercado_livre_link_count||0)+' · Links intermediários: '+(v.redirect_link_count||0)+' · Produtos identificáveis: '+(v.distinct_product_codes||0)+' · Códigos: '+((v.product_codes||[]).join(', ')||'nenhum')+' · Scripts: '+(v.script_count||0)+' · Diagnóstico: '+(v.diagnosis||v.reason||'indisponível')+' · Dados Next.js: '+(v.structured_data?.next_data_parseable?'legíveis':v.structured_data?.next_data_present?'não interpretados':'ausentes')+' · JSON-LD legíveis: '+(v.structured_data?.json_ld_parseable||0)+' · Possíveis produtos: '+(v.structured_data?.candidate_count||0)+' · Enriquecidos: '+(v.structured_data?.enriched_count||0)+' · Validados: '+(v.structured_data?.validated_count||0)+' · Sem destino: '+(v.structured_data?.missing_destination_count||0)+' · Campos de destino: '+((v.structured_data?.schema_field_paths||[]).slice(0,12).join(', ')||'não encontrados')+' · URLs candidatas: '+((v.structured_data?.url_candidates||[]).slice(0,8).map(x=>x.field+'='+x.url).join('; ')||'nenhuma')+' · Tipos de endereço: '+(Object.entries(v.structured_data?.destination_types||{}).map(([k,n])=>k+'='+n).join(', ')||'nenhum')+' · Rotas/slugs: '+((v.structured_data?.route_fields||[]).slice(0,8).map(x=>x.field+'='+x.value).join('; ')||'nenhum')+' · Importação autorizada: não · Amostras: '+((v.structured_data?.product_samples||[]).map(p=>(p.title||'sem título')+' [preço: '+(p.price||'não informado')+'; slug: '+(p.product_slug||'não identificado')+'; destino de produto: '+(p.destination||'não identificado')+'; perfil afiliado: '+(p.affiliate_profile_url||'não identificado')+'; link curto: '+(p.marketplace_short_url||'não identificado')+'; validação: '+p.validation+']').join('; ')||'nenhuma')+' · Framework: '+(Object.entries(v.framework||{}).filter(x=>x[1]).map(x=>x[0]).join(', ')||'não identificado')+' · Scripts externos: '+((v.script_sources||[]).map(x=>x.host+x.path).slice(0,5).join('; ')||'nenhum')+' · Sinais: '+(Object.entries(v.data_signals||{}).filter(x=>x[1]).map(x=>x[0]).join(', ')||'nenhum')+' · Evidências: '+((v.product_evidence||[]).map(x=>x.code+' ('+x.occurrences+' ocorrência(s), '+x.contexts.join('/')+', próximo a link: '+(x.near_marketplace_url?'sim':'não')+')').join('; ')||'nenhuma')+' · Importados: 0':'Diagnóstico indisponível'}catch(e){probeText.textContent='Não foi possível testar a fonte'}finally{probeButton.disabled=false}};
const linkValidationPanel=node('div','',probePanel);const linkValidationText=node('p','Verificação de redirecionamentos ainda não executada. Nenhum link será importado.',linkValidationPanel,'muted');
const linkValidationButton=node('button','Validar links meli.la (diagnóstico)',linkValidationPanel,'secondary');
linkValidationButton.onclick=async()=>{linkValidationButton.disabled=true;linkValidationText.textContent='Lendo links encontrados na fonte...';const results=[];let count=0;let total=0;try{const initial=await fetch('/api/affiliate-links?action=pechinchou_probe',{headers:{Authorization:'Bearer '+key},cache:'no-store'});const probe=await initial.json();if(!initial.ok||!probe.ok)throw Error('Fonte indisponível: '+(probe.reason||initial.status));const links=probe.structured_data?.short_links||[];total=links.length;if(!total)throw Error('Nenhum link curto identificado na leitura atual');for(let i=0;i<links.length;i+=5){const r=await fetch('/api/affiliate-links?action=validate_short_links',{method:'POST',headers:{Authorization:'Bearer '+key,'Content-Type':'application/json'},body:JSON.stringify({links:links.slice(i,i+5)})});const v=await r.json();if(!r.ok||!v.ok||!Array.isArray(v.checks))throw Error('HTTP '+r.status+': '+(v.reason||'resposta inválida'));results.push(...v.checks);count+=v.checked;linkValidationText.textContent='Verificados '+count+' de '+total+' links...';}let profileInspection='';const profile=results.find(x=>x.destination_type==='affiliate_profile')?.destination_url;if(profile){try{const pr=await fetch('/api/affiliate-links?action=inspect_affiliate_profile',{method:'POST',headers:{Authorization:'Bearer '+key,'Content-Type':'application/json'},body:JSON.stringify({profile_url:profile})});const pd=await pr.json();profileInspection=' · Inspeção do perfil: '+(pd.status||'falhou')+' · Códigos MLB encontrados na página: '+(pd.products||[]).map(x=>x.product_code).join(', ')+' (sem associação confirmada com as ofertas).';}catch{profileInspection=' · Inspeção do perfil indisponível.'}}linkValidationText.textContent='Links encontrados: '+total+' · Verificados: '+count+' · Destinos de produtos: '+results.filter(x=>x.destination_type==='product').length+' · Perfis de afiliados: '+results.filter(x=>x.destination_type==='affiliate_profile').length+' · Não confirmados: '+results.filter(x=>!x.destination_type||x.destination_type==='other_marketplace_page').length+' · Importados: 0 · Links próprios criados: 0.'+profileInspection+' Detalhes: '+results.map(x=>x.short_url+' ['+x.status+'; destino: '+(x.destination_url||'não identificado')+'; código: '+(x.product_code||'não identificado')+'; indício no parâmetro: '+(x.product_code_hint||'nenhum')+'; etapas: '+(x.redirect_evidence||[]).map(h=>h.host+h.path+' {parâmetros: '+(h.query_keys||[]).join(',')+'}').join(' > ')+']').join('; ');}catch(e){linkValidationText.textContent='Verificação parcial: '+count+' de '+total+' links. '+e.message+'. Nenhuma importação executada.'}finally{linkValidationButton.disabled=false}};
const queuePanel=node('div','',top,'panel');node('h3','Fila de ofertas Pechinchou',queuePanel);node('p','Ofertas coletadas para análise. Links de terceiros não são links de afiliado da sua conta.',queuePanel,'muted');const queueStatus=node('p','Carregando fila...',queuePanel,'muted');const queueList=node('div','',queuePanel,'stack');const queueRefresh=node('button','Atualizar fila',queuePanel,'secondary');const loadQueue=async()=>{queueRefresh.disabled=true;try{const r=await fetch('/api/affiliate-links?action=pechinchou_queue',{headers:{Authorization:'Bearer '+key},cache:'no-store'});const v=await r.json();if(!r.ok||!v.ok)throw Error('Não foi possível carregar fila');queueStatus.textContent=v.offers.length+' ofertas registradas · identificação pendente';queueList.replaceChildren();for(const o of v.offers){const card=node('div','',queueList,'product-card');node('strong',o.title||'Oferta sem título',card);node('p',o.status+(o.product_code?' · '+o.product_code:'')+(o.last_match_status?' · Busca automática: '+o.last_match_status:''),card,'muted');if(Array.isArray(o.candidate_matches)&&o.candidate_matches.length){node('p','Possíveis correspondências (não verificadas):',card,'muted');for(const match of o.candidate_matches){const m=node('a',match.product_code+' · Similaridade '+match.score+'%',card);m.href=match.product_url;m.target='_blank';m.rel='noopener noreferrer';}}const link=node('a','Abrir link original',card);link.href=o.short_url;link.target='_blank';link.rel='noopener noreferrer';}}catch(e){queueStatus.textContent=e.message}finally{queueRefresh.disabled=false}};queueRefresh.onclick=loadQueue;loadQueue();
const oauthProbe=node('button','Testar pesquisa autenticada Mercado Livre',queuePanel,'secondary');const oauthResult=node('p','',queuePanel,'muted');oauthProbe.onclick=async()=>{oauthProbe.disabled=true;oauthResult.textContent='Verificando permissões oficiais...';try{const first=queueList.querySelector('strong');if(!first)throw Error('Fila vazia');const response=await fetch('/api/affiliate-links?action=mercadolivre_oauth_search_probe',{method:'POST',headers:{Authorization:'Bearer '+key,'Content-Type':'application/json'},body:JSON.stringify({title:first.textContent})});const data=await response.json();oauthResult.textContent=data.ok?'Resultado OAuth: '+data.status+' · anúncios retornados: '+(data.products||0):'Falha ao testar autorização';}catch(e){oauthResult.textContent='Não foi possível testar a pesquisa autenticada'}finally{oauthProbe.disabled=false}};
const automaticPanel=node('div','',top,'panel');node('h3','Coleta automática Pechinchou — Render',automaticPanel);const automaticStatus=node('p','Consultando última execução...',automaticPanel,'muted');const refreshAutomatic=node('button','Atualizar coleta',automaticPanel,'secondary');const loadAutomatic=async()=>{refreshAutomatic.disabled=true;try{const r=await fetch('/api/affiliate-links?action=pechinchou_automatic_status',{headers:{Authorization:'Bearer '+key},cache:'no-store'});const v=await r.json();if(!r.ok||!v.ok)throw Error('Falha ao consultar coleta');const run=v.latest;if(!run){automaticStatus.textContent='Rotina configurada para cada 8 horas. Nenhuma execução registrada ainda.';return;}const info=run.details||{};automaticStatus.textContent='Última execução: '+new Date(run.finished_at).toLocaleString('pt-BR')+' · Status: '+run.status+' · Ofertas coletadas: '+(info.collected??0)+' · Links curtos: '+(info.short_links??0)+' · Produtos identificados: '+(info.identified_products??0)+' · Importados: '+(info.imported??0)+' · Publicados: '+(info.published??0)+' · Busca Mercado Livre: '+JSON.stringify(info.api_statuses||{})+' · Ofertas com candidatos: '+(info.api_candidate_offers??0)+' · Motivo: '+(info.reason||'sem observações')+'. Diagnóstico a cada 8 horas; geração de afiliados desativada.';}catch(e){automaticStatus.textContent=e.message;}finally{refreshAutomatic.disabled=false;}};refreshAutomatic.onclick=loadAutomatic;loadAutomatic();
const intakePanel=node('div','',top,'panel');node('h3','Integração Pechinchou → Mercado Livre',intakePanel);const intakeStatus=node('p','Verificando situação da integração...',intakePanel,'muted');fetch('/api/affiliate-links?action=integration_readiness',{headers:{Authorization:'Bearer '+key},cache:'no-store'}).then(async r=>{const t=await r.text();let data;try{data=JSON.parse(t)}catch{throw Error('Servidor retornou HTTP '+r.status+' em vez de JSON')};if(!r.ok)throw Error('Erro HTTP '+r.status+': '+(data.reason||'Falha no servidor'));return data}).then(v=>{if(!v.ok)throw Error('Diagnóstico indisponível');intakeStatus.textContent='Pechinchou: '+(v.pechinchou.enabled&&v.pechinchou.authorized?'Fonte habilitada':'Coleta não habilitada')+' · Links cadastrados: '+v.mercado_livre.registered_links+' · Rascunhos: '+v.offers.drafts+' · Conversão automática: ainda não verificada.'}).catch(e=>{intakeStatus.textContent=e.message});
