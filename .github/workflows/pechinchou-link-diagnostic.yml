name: FoxCore Pechinchou Link Diagnostic
on:
  push:
    paths:
      - 'scripts/pechinchou-para-mercadolivre.js'
      - 'scripts/pechinchou-para-mercadolivre.test.js'
      - '.github/workflows/pechinchou-link-diagnostic.yml'
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/pechinchou-para-mercadolivre.js
      - run: node --test scripts/pechinchou-para-mercadolivre.test.js
